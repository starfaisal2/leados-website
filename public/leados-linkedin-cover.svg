<svg width="1128" height="191" viewBox="0 0 1128 191" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1128" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C8F0"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="200" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8F0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00C8F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <ellipse cx="200" cy="95" rx="300" ry="150" fill="url(#glow1)"/>
  <ellipse cx="950" cy="60" rx="200" ry="120" fill="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="63" x2="1128" y2="63" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="127" x2="1128" y2="127" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="376" y1="0" x2="376" y2="191" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="752" y1="0" x2="752" y2="191" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- L mark -->
  <rect x="52" y="44" width="18" height="104" rx="9" fill="url(#mark)"/>
  <rect x="52" y="130" width="68" height="18" rx="9" fill="url(#mark)"/>

  <!-- Signal dot + rings -->
  <circle cx="126" cy="55" r="9" fill="#00C8F0"/>
  <circle cx="126" cy="55" r="16" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.5"/>
  <circle cx="126" cy="55" r="24" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="148" y="112" font-family="Inter, -apple-system, Arial, sans-serif" font-size="52" font-weight="800" fill="white" letter-spacing="-1">LeadOS</text>

  <!-- Divider -->
  <line x1="380" y1="55" x2="380" y2="136" stroke="white" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="408" y="87" font-family="Inter, -apple-system, Arial, sans-serif" font-size="26" font-weight="700" fill="url(#text-grad)" letter-spacing="-0.3">The AI Operating System</text>
  <text x="408" y="122" font-family="Inter, -apple-system, Arial, sans-serif" font-size="26" font-weight="700" fill="url(#text-grad)" letter-spacing="-0.3">That Grows Your Business</text>

  <!-- Pills: CRM · Company Brain · Auto SEO -->
  <rect x="408" y="140" width="58" height="22" rx="11" fill="rgba(79,70,229,0.2)" stroke="rgba(165,180,252,0.3)" stroke-width="1"/>
  <text x="437" y="155" font-family="Inter, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.5">CRM</text>

  <rect x="476" y="140" width="116" height="22" rx="11" fill="rgba(79,70,229,0.2)" stroke="rgba(165,180,252,0.3)" stroke-width="1"/>
  <text x="534" y="155" font-family="Inter, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.5">COMPANY BRAIN</text>

  <rect x="602" y="140" width="90" height="22" rx="11" fill="rgba(0,200,240,0.15)" stroke="rgba(0,200,240,0.3)" stroke-width="1"/>
  <text x="647" y="155" font-family="Inter, -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#00C8F0" text-anchor="middle" letter-spacing="0.5">AUTO SEO</text>

  <!-- Website URL bottom right -->
  <text x="1088" y="172" font-family="Inter, -apple-system, Arial, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.3)" text-anchor="end" letter-spacing="0.5">leadoscrm.com</text>
</svg>
