// ─── EASING ───
const eOut  = t => 1 - Math.pow(1-t,3);
const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
const prg   = (t,s,e) => clamp((t-s)/(e-s),0,1);
const fIn   = (t,s,e) => eOut(prg(t,s,e));
const fOut  = (t,s,e) => eOut(1-prg(t,s,e));
const lerp  = (a,b,t) => a+(b-a)*t;
const pulse = (t,f=1) => 0.7+0.3*Math.sin(t*f*Math.PI*2);
const blink = (t,f=2) => 0.5+0.5*Math.sin(t*f*Math.PI*2);

// ─── ROUND RECT ───
function rr(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r,y); X.lineTo(x+w-r,y);
  X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r);
  X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r);
  X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}

// ─── BG ───
function drawBG(t){
  X.fillStyle='#050c1a'; X.fillRect(0,0,W,H);
  X.strokeStyle='rgba(75,107,251,0.055)'; X.lineWidth=1;
  for(let x=0;x<W;x+=60){ X.beginPath(); X.moveTo(x,0); X.lineTo(x,H); X.stroke(); }
  for(let y=0;y<H;y+=60){ X.beginPath(); X.moveTo(0,y); X.lineTo(W,y); X.stroke(); }
  // vignette
  let g=X.createRadialGradient(W/2,H/2,180,W/2,H/2,680);
  g.addColorStop(0,'transparent'); g.addColorStop(1,'rgba(5,12,26,0.88)');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // centre glow
  g=X.createRadialGradient(W/2,430,0,W/2,430,380);
  g.addColorStop(0,`rgba(75,107,251,${0.12*pulse(t,0.35)})`); g.addColorStop(1,'transparent');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  // corner glow amber
  g=X.createRadialGradient(W,H,0,W,H,400);
  g.addColorStop(0,`rgba(74,222,128,${0.06*pulse(t,0.5)})`); g.addColorStop(1,'transparent');
  X.fillStyle=g; X.fillRect(0,0,W,H);
}

// ─── LOGO ───
function drawLogo(t){
  const a=fIn(t,0.2,0.9); X.globalAlpha=a;
  if(LOGO_IMG.complete) X.drawImage(LOGO_IMG,56,42,62,62);

  X.fillText('AI OPERATING SYSTEM', W-56, 80);
  X.globalAlpha=1;
}

// ─── DASHBOARD SHELL ───
function dashShell(t){
  const a=fIn(t,0.7,1.7), dy=lerp(28,0,eOut(prg(t,0.7,1.7)));
  X.globalAlpha=a; X.save(); X.translate(0,dy);
  const px=58,py=134,pw=W-116,ph=755;
  rr(px,py,pw,ph,22); X.fillStyle='rgba(9,17,38,0.97)'; X.fill();
  rr(px,py,pw,ph,22); X.strokeStyle='rgba(75,107,251,0.28)'; X.lineWidth=1.5; X.stroke();
  // top shine
  rr(px+1,py+1,pw-2,1,0); X.fillStyle='rgba(255,255,255,0.04)'; X.fill();
  // traffic dots
  [[0,'#ff5f57'],[18,'#febc2e'],[36,'#28c840']].forEach(([dx,c])=>{
    X.beginPath(); X.arc(px+22+dx,py+25,6,0,Math.PI*2); X.fillStyle=c; X.fill();
  });
  X.font='500 13px sans-serif'; X.fillStyle='rgba(255,255,255,0.38)';
  X.textAlign='center'; X.fillText('LeadOS · Command Center',W/2,py+30);
  // LIVE badge
  rr(px+pw-96,py+12,84,26,13); X.fillStyle='rgba(75,107,251,0.12)'; X.fill();
  rr(px+pw-96,py+12,84,26,13); X.strokeStyle='rgba(75,107,251,0.38)'; X.lineWidth=1; X.stroke();
  X.beginPath(); X.arc(px+pw-80,py+25,4,0,Math.PI*2);
  X.fillStyle=`rgba(74,222,128,${blink(t)})`; X.fill();
  X.font='600 11px sans-serif'; X.fillStyle='#4B6BFB'; X.textAlign='left'; X.fillText('Live',px+pw-70,py+30);
  // separator
  X.beginPath(); X.moveTo(px+14,py+50); X.lineTo(px+pw-14,py+50);
  X.strokeStyle='rgba(255,255,255,0.06)'; X.lineWidth=1; X.stroke();
  X.restore(); X.globalAlpha=1;
  return {px,py,pw,ph,a,dy};
}

// ─── STAT CARDS ───
function drawStats(t,py,dy){

  const sy=py+62, cw=214, gap=14, startX=72;

    X.font='11px sans-serif'; X.fillStyle='rgba(255,255,255,0.22)'; X.fillText(s.sub,cx+14,cy+80);

}

  const pa=fIn(t,1.4,2.2);

  X.font='600 11px sans-serif'; X.fillStyle='rgba(255,255,255,0.32)';
  X.textAlign='left'; X.fillText('INCOMING LEADS',lx+14,ly+24);
  X.beginPath(); X.arc(lx+lw-20,ly+18,5,0,Math.PI*2);

  LEADS.forEach((ld,i)=>{
    const a=fIn(t,ld.at,ld.at+0.55), sx=lerp(-24,0,eOut(prg(t,ld.at,ld.at+0.4)));
    if(a<=0.01) return;
    X.globalAlpha=pa*a;
    X.save(); X.translate(sx,0);
    const ry=ly+42+i*114;
    rr(lx+10,ry,lw-20,100,11); X.fillStyle='rgba(255,255,255,0.028)'; X.fill();
    rr(lx+10,ry,lw-20,100,11); X.strokeStyle='rgba(255,255,255,0.05)'; X.lineWidth=1; X.stroke();
    // avatar
    X.beginPath(); X.arc(lx+50,ry+50,26,0,Math.PI*2); X.fillStyle=ld.bg+'28'; X.fill();
    X.beginPath(); X.arc(lx+50,ry+50,26,0,Math.PI*2); X.strokeStyle=ld.bg+'55'; X.lineWidth=1.5; X.stroke();
    X.font='bold 16px sans-serif'; X.fillStyle=ld.bg; X.textAlign='center'; X.fillText(ld.ch,lx+50,ry+56);
    X.font='600 14px sans-serif'; X.fillStyle='rgba(255,255,255,0.85)'; X.textAlign='left'; X.fillText(ld.n,lx+86,ry+38);
    X.font='12px sans-serif'; X.fillStyle='rgba(255,255,255,0.35)'; X.fillText(ld.src,lx+86,ry+57);
    // badge
    const bw=ctx_measure(ld.st,X,'600 11px sans-serif')+22;
    rr(lx+lw-18-bw,ry+36,bw,26,13); X.fillStyle=ld.sc+'20'; X.fill();
    rr(lx+lw-18-bw,ry+36,bw,26,13); X.strokeStyle=ld.sc+'45'; X.lineWidth=1; X.stroke();
    X.font='600 11px sans-serif'; X.fillStyle=ld.sc; X.textAlign='center';
    X.fillText(ld.st,lx+lw-18-bw/2,ry+53);
    X.restore(); X.globalAlpha=pa;
  });
  X.restore(); X.globalAlpha=1;
}

function ctx_measure(txt,ctx,font){ ctx.font=font; return ctx.measureText(txt).width; }

// ─── AI PANEL ───
function drawAI(t,px,py,pw,dy){
  const pa=fIn(t,1.4,2.2);
  X.globalAlpha=pa; X.save(); X.translate(0,dy);
  const lw=(W-116-30)/2;
  const ax=px+14+lw+16, ay=py+168, aw=lw, ah=530;
  rr(ax,ay,aw,ah,14); X.fillStyle='rgba(255,255,255,0.018)'; X.fill();
  rr(ax,ay,aw,ah,14); X.strokeStyle='rgba(255,255,255,0.058)'; X.lineWidth=1; X.stroke();
  X.font='600 11px sans-serif'; X.fillStyle='rgba(255,255,255,0.32)';
  X.textAlign='left'; X.fillText('AI BRAIN · WORKING NOW',ax+14,ay+24);

  // thinking box
  const ta=fIn(t,3.2,4.0);
  if(ta>0.01){
    X.globalAlpha=pa*ta;
    rr(ax+10,ay+42,aw-20,118,11); X.fillStyle='rgba(75,107,251,0.065)'; X.fill();
    rr(ax+10,ay+42,aw-20,118,11); X.strokeStyle='rgba(75,107,251,0.22)'; X.lineWidth=1; X.stroke();
    X.font='600 10px sans-serif'; X.fillStyle='#4B6BFB';
    X.textAlign='left'; X.fillText("PROCESSING · SARA'S ENQUIRY",ax+20,ay+62);
    X.font='12px sans-serif'; X.fillStyle='rgba(255,255,255,0.5)';
    ["\"Hi, I'm interested in a lip","filler appointment next week...\""].forEach((l,i)=>X.fillText(l,ax+20,ay+82+i*19));
    // typing dots
    const da=fIn(t,3.8,4.4)*fOut(t,8.0,8.6);
    if(da>0.01){
      X.globalAlpha=pa*ta*da;
      [0,1,2].forEach(i=>{
        const bounce=Math.sin((t*3.5-i*0.28)*Math.PI*2)*5;
        X.beginPath(); X.arc(ax+24+i*16,ay+134+bounce,4.5,0,Math.PI*2);
        X.fillStyle='#4B6BFB'; X.fill();
      });
      X.font='11px sans-serif'; X.fillStyle='rgba(255,255,255,0.28)';
      X.textAlign='left'; X.fillText('AI composing reply...',ax+66,ay+136);
    }
    X.globalAlpha=pa*ta;
  }

  // reply box
  const ra=fIn(t,8.2,9.0);
  if(ra>0.01){
    X.globalAlpha=pa*ra;
    rr(ax+10,ay+172,aw-20,128,11); X.fillStyle='rgba(74,222,128,0.05)'; X.fill();
    rr(ax+10,ay+172,aw-20,128,11); X.strokeStyle='rgba(74,222,128,0.22)'; X.lineWidth=1; X.stroke();
    X.font='600 10px sans-serif'; X.fillStyle='#4ade80';
    X.textAlign='left'; X.fillText('✦  AI REPLY SENT · 3 SECONDS',ax+20,ay+192);
    X.font='12px sans-serif'; X.fillStyle='rgba(255,255,255,0.65)';
    ['"Hi Sara! 😊 We have availability',
     'Tuesday 2pm or Thursday 11am.',
     'Shall I book you in?"'].forEach((l,i)=>X.fillText(l,ax+20,ay+214+i*20));
  }

  // booking card
  const ba=fIn(t,10.0,10.8);
  if(ba>0.01){
    X.globalAlpha=pa*ba;
    rr(ax+10,ay+312,aw-20,130,11); X.fillStyle='rgba(251,191,36,0.05)'; X.fill();
    rr(ax+10,ay+312,aw-20,130,11); X.strokeStyle='rgba(251,191,36,0.26)'; X.lineWidth=1; X.stroke();
    X.font='600 10px sans-serif'; X.fillStyle='#fbbf24';
    X.textAlign='left'; X.fillText('APPOINTMENT BOOKED AUTOMATICALLY',ax+20,ay+332);
    X.font='13px sans-serif'; X.fillStyle='rgba(255,255,255,0.62)';
    ['👤  Sara Al Mansouri',
     '📅  Tuesday, 2:00pm · Lip Filler',
     '✅  Confirmation sent via WhatsApp'].forEach((l,i)=>X.fillText(l,ax+20,ay+358+i*25));
  }

  X.restore(); X.globalAlpha=1;
}

// ─── AI BRAIN ───
function drawBrain(t){
  const a=fIn(t,2.0,3.0); if(a<0.01) return;
  X.globalAlpha=a;
  const bx=W-98, by=H-108;
  // glow
  let g=X.createRadialGradient(bx,by,0,bx,by,55+pulse(t)*8);
  g.addColorStop(0,`rgba(75,107,251,${0.18*pulse(t)})`); g.addColorStop(1,'transparent');
  X.fillStyle=g; X.beginPath(); X.arc(bx,by,70,0,Math.PI*2); X.fill();
  // outer ring spinning
  X.save(); X.translate(bx,by); X.rotate(t*0.6);
  X.beginPath(); X.arc(0,0,44,0,Math.PI*2);
  X.setLineDash([9,7]); X.strokeStyle='rgba(75,107,251,0.35)'; X.lineWidth=2; X.stroke();
  X.setLineDash([]); X.restore();
  // inner ring reverse
  X.save(); X.translate(bx,by); X.rotate(-t*0.9);
  X.beginPath(); X.arc(0,0,32,0,Math.PI*2);
  X.setLineDash([5,5]); X.strokeStyle='rgba(75,107,251,0.55)'; X.lineWidth=1.5; X.stroke();
  X.setLineDash([]); X.restore();
  // core
  X.beginPath(); X.arc(bx,by,19,0,Math.PI*2); X.fillStyle='rgba(75,107,251,0.14)'; X.fill();
  X.beginPath(); X.arc(bx,by,19,0,Math.PI*2); X.strokeStyle='#4B6BFB'; X.lineWidth=2; X.stroke();
  X.font='17px sans-serif'; X.textAlign='center'; X.fillText('🧠',bx,by+6);
  X.globalAlpha=1;
}

let tickX=0;

function drawTicker(t,dt){
  const a=fIn(t,2.5,3.2); if(a<0.01) return;
  X.globalAlpha=a;
  const tx=56,ty=H-66,tw=W-112,th=50;
  rr(tx,ty,tw,th,12); X.fillStyle='rgba(8,15,34,0.96)'; X.fill();

  // label
  X.font='700 10px sans-serif'; X.fillStyle='#4B6BFB';
  X.textAlign='left'; X.fillText('AUTO SEO',tx+16,ty+29);
  X.beginPath(); X.moveTo(tx+88,ty+10); X.lineTo(tx+88,ty+th-10);
  X.strokeStyle='rgba(255,255,255,0.09)'; X.lineWidth=1; X.stroke();
  // scrolling
  tickX += dt*55;
  X.save(); X.beginPath(); X.rect(tx+96,ty,tw-100,th); X.clip();
  X.font='12px sans-serif'; X.textAlign='left';
  const fullW = ctx_measure(TICKSTR,X,'12px sans-serif')+60;
  const xo = tx+104 - (tickX % fullW);
  for(let r=0;r<3;r++){
    const sx=xo+r*fullW;
    // draw with green highlight on ✦
    let cx=sx;
    TICKERS.forEach((item,i)=>{
      const parts=item.split('—');
      X.fillStyle='#4ade80';
      X.fillText(parts[0].trim(),cx,ty+29);
      const p0w=ctx_measure(parts[0].trim(),X,'12px sans-serif');
      cx+=p0w+8;
      if(parts[1]){
        X.fillStyle='rgba(255,255,255,0.45)';
        X.fillText('— '+parts[1].trim(),cx,ty+29);
        cx+=ctx_measure('— '+parts[1].trim(),X,'12px sans-serif');
      }
      cx+=60;
    });
  }
  X.restore(); X.globalAlpha=1;
}

// ─── URL ───
function drawURL(t){
  X.globalAlpha=fIn(t,1.2,2.2)*0.38;
  X.font='12px sans-serif'; X.fillStyle='rgba(255,255,255,0.55)';
  X.textAlign='center'; X.fillText('www.leadoscrm.com',W/2,H-20);
  X.globalAlpha=1;
}

// ─── MAIN LOOP ───
const LOOP=14;
let T0=null, last=null;
function frame(now){
  if(!T0) T0=now;
  const elapsed=(now-T0)/1000;
  const t=elapsed%LOOP;
  const dt=last?(now-last)/1000:0;
  last=now;
  X.clearRect(0,0,W,H);
  drawBG(t);
  drawLogo(t);
  const {px,py,pw,ph,a,dy}=dashShell(t);
  drawStats(t,py,dy);
  drawLeads(t,px,py,dy);
  drawAI(t,px,py,pw,dy);
  drawNotifs(t);
  drawBrain(t);
  drawTicker(t,dt);
  drawURL(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─── RECORD ───
let recording=false;
async function startRec(){
  if(recording) return;
  recording=true;
  const btn=document.getElementById('btn');
  const status=document.getElementById('status');
  btn.className='rec'; btn.textContent='⏺ Recording...';
  // reset animation
  T0=performance.now(); tickX=0;
  const chunks=[];
  const stream=C.captureStream(30);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ?'video/webm;codecs=vp9':'video/webm';
  const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000});
  mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  mr.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='leados-ai-demo.webm'; a.click();
    URL.revokeObjectURL(url);
    btn.className=''; btn.textContent='⏺ Record Again';
    status.textContent='✅ Saved as leados-ai-demo.webm — open in VLC or convert to MP4 with Handbrake (free)';
    recording=false;
  };
  mr.start(100);
  let s=15;
  status.textContent=`Recording... ${s}s remaining`;
  const iv=setInterval(()=>{
    s--;
    status.textContent=s>0?`Recording... ${s}s remaining`:'Finishing...';
    if(s<=0){clearInterval(iv);mr.stop();}
  },1000);
}
</script>
